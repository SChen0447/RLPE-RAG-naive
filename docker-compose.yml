services:
  api:
    build: .
    image: naive-rag:latest
    container_name: naive-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - naive_rag_chroma_data:/naive_rag/data_base       # ← 持久化向量库
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  naive_rag_chroma_data: